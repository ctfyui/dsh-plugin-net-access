# Only replace the official local subprocess provider on Windows.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: !!js process.platform === 'win32'
- insert:
    - id: net-access-subprocess
      name: '@ctfyui/dsh-plugin-net-access'
      disabled: !!js process.platform !== 'win32'
# DSH replaces this complete config. User profile overrides apply last.
# Net Access is a display preset, never a new sandbox mode.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      net-access:
        sandbox: workspace-write
        approval: ask
        name: Net Access
        description: Native workspace-write protection with non-Schannel curl tooling.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
